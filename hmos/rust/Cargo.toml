[workspace]
resolver = "2"

[package]
name = "morrow-hmos"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
morrow-core = { path = "../shared/core" }
morrow-workbench-plugin = { path = "../shared/plugins/workbench" }
prost = "=0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
panic = "abort"
opt-level = "s"
