[workspace]
resolver = "2"

[package]
name = "morrow-hmos"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
morrow-core = { path = "../shared/core" }
morrow-workbench-plugin = { path = "../shared/plugins/workbench" }
morrow-editor-draft-model = { path = "editor-draft-model" }
morrow-editor-draft-staging-model = { path = "editor-draft-staging-model" }
prost = "=0.14.4"
pulldown-cmark = { version = "=0.13.4", default-features = false }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "=0.24.0", default-features = false }
html5ever = "=0.35.0"
roxmltree = "=0.21.1"
base64 = "=0.22.1"
encoding_rs = "=0.8.35"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
panic = "abort"
opt-level = "s"
