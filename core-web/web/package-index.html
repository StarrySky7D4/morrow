<!doctype html><meta charset="utf-8"><title>Morrow browser package parity qualification</title>
<script type="module">
let worker;
const timeout = setTimeout(() => {
  worker?.terminate();
  globalThis.coreProbeResult = 'FAIL: package worker timeout';
}, 55000);
function finish(data) { clearTimeout(timeout); globalThis.coreProbeResult = data; }
let first, reopenDeadline;
function start(restore) {
  worker = new Worker(`./package-worker.mjs${restore ? '?restore=1' : ''}`, {type: 'module'});
  worker.onmessage = ({data}) => {
    if (data.startsWith('PASS:') && !restore) {
      first = data; reopenDeadline = Date.now() + 5000;
      setTimeout(() => start(true), 100);
    } else if (data.startsWith('RETRY:') && Date.now() < reopenDeadline) {
      // Only opening the OPFS pool retries; no mutation is replayed.
      setTimeout(() => start(true), 100);
    } else { finish(restore && data.startsWith('PASS:') ? `${first}; ${data}` : data.replace(/^RETRY:/, 'FAIL:')); }
  };
  worker.onerror = event => { finish(`FAIL: ${event.message}`); worker.terminate(); };
}
start(false);
</script>
