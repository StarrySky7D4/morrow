[workspace]
resolver = "2"
[package]
name = "morrow-native-pipe-win"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com"] }

tokio = { version = "=1.53.1", features = ["net", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt"] }
