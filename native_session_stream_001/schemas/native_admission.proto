syntax = "proto3";
package morrow.native_admission.v1;
// Host-local persistence only; not a guest IPC or restorable live authority.
message Profile {
  uint32 version = 1;
  string identity = 2;
  string slot = 3;
  bytes core_identity_sha256 = 4;
  string lock_namespace = 5;
  uint32 runtime_mode = 7; // 0 legacy,1 independent supervisor; bound to ledger version
  string canonical_root = 6; // profile copies/relocations are not restorable owner domains
}
message Approval {
  uint32 version = 1;
  string id = 2;
  string issuer = 3;
  string profile = 4;
  string slot = 5;
  string plugin_id = 6;
  string role = 7;
  string operation = 8;
  bytes artifact_sha256 = 9;
  bytes config_sha256 = 10;
  bytes schema_sha256 = 11;
  uint64 generation = 12;
  uint64 capabilities = 13;
  uint64 lifetime_ms = 14;
  uint64 approved_unix_ms = 15; // diagnostics only; never renews Instant deadline
  uint32 state = 16; // 1 approved,2 consumed,3 revoked,4 expired
  uint32 revocation_source = 17; // first durable revocation: 0 none,1 operator,2 owner runtime
  uint32 revocation_reason = 18; // operator=19; owner reason16..30; immutable once revoked
}
message Owner {
  uint32 version = 1;
  string grant_id = 2;
  string issuer = 3;
  uint64 generation = 4;
  string phase = 5;
  uint32 child_pid = 6;
  uint64 session = 7;
  uint64 epoch = 8;
  bool exit_observed = 9;
  bool stdout_eof = 10;
  bool stderr_eof = 11;
  bytes snapshot_sha256 = 12;
}
// New-version native HTTP approval only; original Core stores attempts and materials.
message HttpApproval {
  uint32 version = 1;
  bytes id = 2;
  string parent_id = 3;
  bytes parent_sha256 = 4;
  bytes proposal_ref = 5;
  bytes request_sha256 = 6;
  bytes body_sha256 = 7;
  bytes endpoint_ref = 8;
  bytes core_request_sha256 = 9;
  uint32 response_limit = 10;
  uint32 state = 11; // 1 approved,2 consumed,3 revoked; no authority restored from disk
  uint32 send_budget = 12;
}

// Trusted supervisor-local proof. Never reconstructs live approval or retries Unknown.
message Recovery {
 uint32 version=1;
 string profile=2;
 string grant_id=3;
 string issuer=4;
 uint64 generation=5;
 string incarnation=6;
 uint32 supervisor_pid=7;
 string phase=8;
 uint32 child_pid=9;
 uint64 session=10;
 uint64 epoch=11;
 bytes artifact_sha256=12;
 bytes config_sha256=13;
 bytes snapshot_sha256=14;
 bool tree_empty=15;
 bool child_exit=16;
 bool stdout_eof=17;
 bool stderr_eof=18;
 bool pipe_joined=19;
 bool network_joined=20;
 bool gate_closed=21;
}
