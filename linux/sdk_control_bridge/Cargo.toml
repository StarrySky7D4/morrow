[workspace]
resolver = "2"

[package]
name = "morrow-linux-sdk-control-bridge"
version = "0.1.0-experimental.1"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
morrow-linux-supervisor-foundation = { path = "../native_supervisor" }
morrow-plugin-sdk = { path = "../../sdk/rust" }
morrow-plugin-runtime = { path = "../../plugin_runtime", features = ["packages"] }
morrow-workbench-host = { path = "../../workbench_host" }
morrow-core = { path = "../../core" }
sha2 = "=0.10.9"
capnp = "=0.24.1"
wat = "=1.239.0"
libc = "=0.2.189"
tempfile = "=3.27.0"

[[bin]]
name = "morrow-linux-sdk-control-fixture"
path = "src/main.rs"
