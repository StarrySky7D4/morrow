syntax = "proto3";
package morrow.oauth_secret.v1;

// Private current-Windows-user DPAPI plaintext. Never part of a guest interface.
message Secret {
  bytes binding = 1;
  bytes reference = 2;
  uint64 revision = 3;
  uint64 account_created_ms = 4;
  uint64 account_expires_ms = 5;
  uint64 access_expires_ms = 6;
  string access_token = 7;
  string refresh_token = 8;
  bytes resource_scope = 9;
}
