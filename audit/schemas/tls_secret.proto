syntax = "proto3";
package morrow.tls_secret.v1;
// Never persist or export this plaintext message.
message Secret {
  uint32 schema_version = 1;
  bytes domain = 2;
  bytes store_id = 3;
  bytes reference = 4;
  uint64 revision = 5;
  bytes certificate_sha256 = 6;
  bytes certificate_pem = 7;
  bytes private_key_pem = 8;
}
