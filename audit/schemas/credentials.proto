syntax = "proto3";
package morrow.credentials.v1;
// This message exists only in zeroized memory or inside current-user DPAPI.
message SecretHeader {
  uint32 schema_version = 1;
  bytes domain = 2;
  bytes reference = 3;
  uint64 revision = 4;
  uint64 created_ms = 5;
  uint64 expires_ms = 6;
  string header_name = 7;
  string header_value = 8;
}
