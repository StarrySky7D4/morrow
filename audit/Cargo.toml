[workspace]
resolver = "2"
[package]
name = "morrow-audit"
version = "0.1.9-test.18"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[dependencies]
morrow-core = { path = "../core" }
prost = "=0.14.4"
sha2 = "=0.10.9"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
[dev-dependencies]
tempfile = "=3.27.0"
[[bin]]
name = "morrow-audit-check"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[features]
# Explicit subprocess crash qualification only; never enabled by the app.
fault-injection = ["morrow-core/fault-injection"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "=1.9.0"
tempfile = "=3.27.0"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"

[[bin]]
name = "morrow-audit-seal"
path = "src/seal_main.rs"
