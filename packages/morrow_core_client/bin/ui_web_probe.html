<!doctype html><meta charset="utf-8"><title>Morrow UI protocol probe</title>
<script type="module">
import { compileStreaming } from './probe.mjs';
globalThis.uiFixture = async name => {
 if(!['document','expected-event'].includes(name))throw Error('Unknown vector');
 const response=await fetch('./'+name+'.capnp');if(!response.ok)throw Error('Missing vector');
 return new Uint8Array(await response.arrayBuffer());
};
try {const module=await compileStreaming(fetch('./probe.wasm'));const instance=await module.instantiate({});await instance.invokeMain();}
catch(error){globalThis.coreProbeResult='FAIL: '+error;}
</script>
