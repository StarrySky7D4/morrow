[workspace]
resolver = "2"
[package]
name = "morrow-workbench-host"
version = "0.1.9-test.50"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[dependencies]
zeroize = "=1.9.0"
semver = "=1.0.28"
getrandom = "=0.4.3"
prost = "=0.14.4"
morrow-core = {path = "../core"}
morrow-plugin-runtime = {path = "../plugin_runtime", features = ["packages"]}
morrow-workbench-plugin = {path = "../plugins/workbench"}
capnp = { version = "=0.24.1", features = ["unaligned"] }
sha2 = "=0.10.9"
[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
capnpc = "=0.24.0"
[dev-dependencies]
rusqlite = "=0.40.2"
tempfile = "=3.27.0"
wat = "=1.239.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
morrow-network-node = { path = "../network_node", features = ["plugin-adapter"] }

[target.'cfg(target_os = "windows")'.dependencies]
morrow-audit = {path = "../audit"}

[features]
fault-injection = ["morrow-core/fault-injection", "morrow-audit/fault-injection"]

[[example]]
name = "qualify_shared_evidence"

[[bin]]
name = "morrow-content-replay"
path = "src/bin/content_replay.rs"
