[workspace]
resolver = "2"
[package]
name = "morrow-workbench-host"
version = "0.1.9-test.50"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[dependencies]
morrow-fs-directory-request-v1 = {path = "../extensions/fs-directory-request-v1"}
x509-parser = { version = "=0.18.1", default-features = false }
rustls-pki-types = "=1.15.1"
zeroize = "=1.9.0"
semver = "=1.0.28"
prost = "=0.14.4"
morrow-core = {path = "../core"}
morrow-plugin-runtime = {path = "../plugin_runtime"}
morrow-workbench-plugin = {path = "../plugins/workbench", default-features = false}
capnp = { version = "=0.24.1", features = ["unaligned"] }
sha2 = "=0.10.9"
serde_json = "=1.0.151"
url = "=2.5.8"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
morrow-agent-catalog-admin-v1 = {path = "../extensions/agent-catalog-admin-v1"}
morrow-agent-catalog-owner-v1 = {path = "../extensions/agent-catalog-owner-v1"}
getrandom = "=0.4.3"
morrow-plugin-runtime = {path = "../plugin_runtime", features = ["packages"]}
morrow-network-node = { path = "../network_node", features = ["plugin-adapter"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "io-std"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
morrow-core = {path = "../core", features = ["web-storage"]}
morrow-plugin-runtime = {path = "../plugin_runtime", features = ["web-packages"]}
[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
capnpc = "=0.24.0"
[dev-dependencies]
codex-utils-path-uri = { path = "../companions/morrow-codex/upstream/p02-integration-004/codex-work/codex-rs/utils/path-uri" }
time = "=0.3.55"
rcgen = "=0.13.2"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rusqlite = "=0.40.2"
tempfile = "=3.27.0"
wat = "=1.239.0"

[target.'cfg(target_os = "windows")'.dependencies]
morrow-agent-session-process-v1-host = {path = "../extensions/agent-session-process-v1-host"}
morrow-agent-session-exec-v1-r2 = {path = "../extensions/agent-session-exec-v1-r2"}
morrow-agent-process-control-v1 = {path = "../extensions/agent-process-control-v1"}
morrow-codex-session-exec-windows-v1 = {path = "../companions/morrow-codex/session-exec-windows-v1"}
morrow-audit = {path = "../audit"}
morrow-native-pipe-win = {path = "../native_pipe_win_001"}
rusqlite = { version = "=0.40.2", features = ["backup"] }
tempfile = "=3.27.0"

[features]
fault-injection = ["morrow-core/fault-injection", "morrow-audit/fault-injection", "morrow-plugin-runtime/fault-injection"]

[[example]]
name = "qualify_shared_evidence"

[[bin]]
name = "morrow-content-replay"
path = "src/bin/content_replay.rs"

[[bin]]
name = 'morrow-migrate-library'
path = 'src/bin/migrate_library.rs'

# Preserve the native companion's existing pinned upstream fork identities.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
