[workspace]
resolver = "2"

[package]
name = "morrow-service-outbound-test-guest"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
morrow-core = { path = "../../../../core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
