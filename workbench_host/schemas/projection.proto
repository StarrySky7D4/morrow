syntax = "proto3";
package morrow.workbench.projection.v1;
// Host observations, not grants, clock attestations, or proof of source authenticity.
message HostProjection {
  uint32 schema_version = 1;
  string operation_id = 2;
  string target_id = 3;
  bytes prior = 4;
  repeated Attachment attachments = 5;
  uint64 observed_now = 6;
  Undo undo = 7;
}
message Attachment {
  string id = 1;
  string display_name = 2;
  string media_type = 3;
  uint64 byte_length = 4;
  bytes sha256 = 5;
}
message Undo {
  uint64 revision = 1;
  uint64 deadline = 2;
}
