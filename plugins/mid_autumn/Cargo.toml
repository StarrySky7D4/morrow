[workspace]
resolver = "2"
[package]
name = "morrow-theme-mid-autumn"
version = "1.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[lib]
crate-type = ["cdylib"]
[dependencies]
morrow-plugin-sdk = { path = "../../sdk/rust", features = ["wasm-guest"] }
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
