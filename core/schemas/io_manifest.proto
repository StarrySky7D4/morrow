syntax = "proto3";
package morrow.plugin.io.v1;
// Independent IO ceilings. No value is a content Capability or a live resource grant.
enum IoCapability {
  IO_CAPABILITY_UNSPECIFIED = 0;
  FILE_READ = 1;
  FILE_LIST = 2;
  FILE_CREATE = 3;
  FILE_REPLACE = 4;
  FILE_DELETE = 5;
  HTTP_REQUEST = 6;
  HTTP_LISTEN = 7;
  HTTP_PUBLISH = 8;
  CREDENTIAL_USE = 9;
  WEB_SOCKET_CONNECT = 10;
}
message IoBudget {
  uint32 max_resources = 1;
  uint32 max_jobs = 2;
  uint64 max_bytes = 3;
  uint64 max_job_bytes = 4;
  uint64 max_duration_ms = 5;
}
message IoDeclaration {
  uint32 schema_version = 1;
  uint32 io_version = 2;
  bytes io_schema_sha256 = 3;
  repeated IoCapability requested_capabilities = 4;
  // Effectful entrypoints are separate from pure TransformHandler registrations.
  repeated string handlers = 5;
  IoBudget budget = 6;
}
