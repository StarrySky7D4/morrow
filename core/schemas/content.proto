syntax = "proto3";
package morrow.content.v1;

// Persistent identities are opaque UTF-8 strings, never paths or live handles.
// Business payloads and unknown fields are retained without invoking a plugin.
message Card {
  uint32 schema_version = 1;
  string id = 2;
  string type_id = 3;
  uint32 format_version = 4;
  uint64 revision = 5;
  string title = 6;
  bytes body = 7;
  repeated BlobRef attachments = 8;
  repeated Relation relations = 9;
  Preview preview = 10;
  optional int64 created_at_unix_ms = 11;
}
message BlobRef {
  string id = 1;
  string display_name = 2;
  string media_type = 3;
  uint64 byte_length = 4;
  bytes sha256 = 5;
}
message Relation {
  string target_card_id = 1;
  string kind = 2;
}
message Preview {
  string plain_text = 1;
  string image_blob_id = 2;
}
message Workspace {
  uint32 schema_version = 1;
  string id = 2;
  string title = 3;
}
// A placement refers to content without owning or duplicating it.
message ViewPlacement {
  uint32 schema_version = 1;
  string id = 2;
  string workspace_id = 3;
  string card_id = 4;
  sint64 order_key = 5;
  bool collapsed = 6;
  uint32 width_units = 7;
}
message Draft {
  uint32 schema_version = 1;
  string id = 2;
  string card_id = 3;
  uint64 base_revision = 4;
  string type_id = 5;
  uint32 format_version = 6;
  bytes body = 7;
}
