syntax = "proto3";
package morrow.blob_stage.v1;

// Host-local immutable storage facts. These bytes never authorize guest IO.
message Record {
  uint32 schema_version = 1;
  bytes owner_domain = 2;
  string operation_id = 3;
  uint64 byte_length = 4;
  bytes sha256 = 5;
  bytes blob_info = 6;
  int64 staged_at_unix_ms = 7;
  optional int64 released_at_unix_ms = 8;
}
