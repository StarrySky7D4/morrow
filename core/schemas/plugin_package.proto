syntax = "proto3";
package morrow.plugin.v1;
// Persistent package metadata. Declarations are ceilings, never grants.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  RENAME_CARD = 1;
  READ_SUMMARY = 2;
  QUERY_OPERATION = 3;
  READ_ATTACHMENT = 4;
}
message ExecutionBudget {
  uint64 fuel = 1;
  uint64 memory_bytes = 2;
  uint32 host_calls = 3;
}
message Manifest {
  uint32 schema_version = 1;
  string package_id = 2;
  string package_version = 3;
  string display_name = 4;
  uint32 guest_abi_version = 5;
  uint32 runtime_protocol_version = 6;
  bytes runtime_schema_sha256 = 7;
  bytes content_schema_sha256 = 8;
  string entrypoint = 9;
  bytes module_sha256 = 10;
  repeated Capability requested_capabilities = 11;
  ExecutionBudget budget = 12;
  // Future mandatory semantics must be named here; unsupported names reject load.
  repeated string required_features = 13;
}
message Package {
  uint32 schema_version = 1;
  // Keep the exact manifest bytes, including future optional fields.
  bytes manifest = 2;
  bytes module = 3;
}
