syntax = "proto3";
package morrow.plugin.registry.v1;
// Canonical v1 snapshot: unknown/noncanonical fields are rejected, never dropped.
message Selection {
  string package_id = 1;
  bytes digest = 2;
  bool enabled = 3;
  // Numeric values match morrow.plugin.v1.Capability. These are ceilings, not grants.
  repeated int32 approved_capabilities = 4;
}
message Registry {
  uint32 schema_version = 1;
  uint64 revision = 2;
  repeated Selection selections = 3;
}
