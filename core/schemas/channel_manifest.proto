syntax = "proto3";
package morrow.plugin.channel.v1;
// Declarations are finite accounting ceilings, never source or external IO grants.
enum ChannelKind { CHANNEL_KIND_UNSPECIFIED = 0; BYTE_STREAM = 1; EVENTS = 2; }
message ChannelBudget {
  uint32 max_channels = 1;
  uint32 max_frame_bytes = 2;
  uint64 max_bytes = 3;
  uint64 max_messages = 4;
  uint64 max_requests = 5;
  uint64 max_duration_ms = 6;
}
message ChannelDeclaration {
  uint32 schema_version = 1;
  uint32 channel_version = 2;
  bytes channel_schema_sha256 = 3;
  repeated string handlers = 4;
  repeated ChannelKind kinds = 5;
  ChannelBudget budget = 6;
}
