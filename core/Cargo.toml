[workspace]
resolver = "2"

[package]
name = "morrow-core"
version = "0.1.9-test.2"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
capnp = "=0.24.1"
prost = "=0.14.4"
prost-reflect = { version = "=0.16.5", default-features = false }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
capnpc = "=0.24.0"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"

[[bin]]
name = "morrow-core-check"
path = "src/main.rs"
