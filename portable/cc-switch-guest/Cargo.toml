[workspace]
resolver = "2"
[package]
name = "morrow-cc-switch-guest"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
[lib]
name = "morrow_plugin"
crate-type = ["cdylib"]
[dependencies]
morrow-cc-switch-pure = { path = "../cc-switch-pure" }
morrow-plugin-sdk = { path = "../../sdk/rust", features = ["wasm-guest"] }
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
