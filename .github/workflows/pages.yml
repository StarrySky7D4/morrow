name: Build and deploy Web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install pinned native and Wasm tools
        run: ./tool/setup_web_ci.ps1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/tools/wasm-bindgen
            build/first-party-plugins
            build/workbench-host
            build/web-channel-core
          key: web-windows-rust-1.96.0-bindgen-0.2.128-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-bindgen
        run: |
          if (!(Test-Path build/tools/wasm-bindgen/bin/wasm-bindgen.exe)) {
            cargo install wasm-bindgen-cli --version 0.2.128 --locked --root build/tools/wasm-bindgen
            if ($LASTEXITCODE -ne 0) { throw 'wasm-bindgen installation failed' }
          }
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Build production application
        run: ./tool/build_web_workbench.ps1 -BaseHref /morrow/
      - name: Theme admission and presentation regression
        run: |
          $bundleHash = (Get-FileHash build/web/workbench/workbench.morrowplugin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleHash -ne 'b28aea5f6989967d33b6c2797624a64068da0b4d1aadc57b8db1c74cc4a79985') { throw 'Bundled workbench bytes changed; existing approvals require review' }
          cargo test --locked --manifest-path workbench_host/Cargo.toml --target-dir build/workbench-host --test theme_import
          if ($LASTEXITCODE -ne 0) { throw 'Theme host admission failed' }
          flutter test --no-pub test/theme_package_selection_test.dart test/theme_plugin_test.dart test/theme_plugin_business_compatibility_test.dart test/mid_autumn_workflow_test.dart test/plugin_library_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Theme presentation regression failed' }
      - name: Browser acceptance before publication
        run: |
          node tool/test_core_browser.mjs --app --base-path /morrow/ --offline-edits
          if ($LASTEXITCODE -ne 0) { throw 'Fresh workspace acceptance failed' }
          node tool/test_core_browser.mjs --app --base-path /morrow/ --legacy
          if ($LASTEXITCODE -ne 0) { throw 'Legacy content acceptance failed' }
          node tool/test_core_browser.mjs --app --base-path /morrow/ --orphan
          if ($LASTEXITCODE -ne 0) { throw 'Orphaned data acceptance failed' }
          node tool/test_core_browser.mjs --app --base-path /morrow/ --media
          if ($LASTEXITCODE -ne 0) { throw 'Imported media preferences acceptance failed' }
          node tool/test_core_browser.mjs --app --base-path /morrow/ --theme --slow-ui 4
          if ($LASTEXITCODE -ne 0) { throw 'Theme import and recovery acceptance failed' }
      - name: Add source and distribution notices
        run: ./tool/package_web_release.ps1
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            build/web-bootstrap-*-failure.*
            build/web-network-*.json
      - uses: actions/upload-pages-artifact@v4
        if: success()
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
