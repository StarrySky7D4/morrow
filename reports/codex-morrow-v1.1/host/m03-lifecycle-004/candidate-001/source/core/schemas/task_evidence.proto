syntax = "proto3";
package morrow.task_evidence.v1;
// Historical observation, never a signature, runtime grant, or content transaction.
enum StableFault {
  UNSPECIFIED = 0;
  TASK_PROTOCOL = 1;
  DEADLINE = 2;
  PACKAGE_BINDING = 3;
  INACTIVE_CONNECTION = 4;
  INVALID_MODULE = 5;
  UNSUPPORTED_ABI = 6;
  LIMITS = 7;
  CANCELLED = 8;
  TRAP = 9;
}
message ExecutionBudget {
  uint64 fuel = 1;
  uint64 memory_bytes = 2;
  uint32 host_calls = 3;
}
message TaskEvidence {
  uint32 schema_version = 1;
  bytes package_archive = 2;
  bytes invocation = 3;
  ExecutionBudget budget = 4;
  string backend = 5;
  bytes completion = 6;
  StableFault fault = 7;
  optional sint32 exit_code = 8;
  uint32 observed_host_calls = 9;
  uint64 fuel_remaining = 10;
  // Present only in schema version 2; fields 3..10 must then be empty/default.
  Batch batch = 11;
}
// One archive is shared by all observations. Intent bytes retain the caller's original intent.
message Batch {
  string intent_type = 1;
  bytes intent = 2;
  uint64 total_fuel = 3;
  repeated Observation observations = 4;
}
// Version 2 admits only successful Output completions with exit code zero.
message Observation {
  bytes invocation = 1;
  ExecutionBudget budget = 2;
  string backend = 3;
  bytes completion = 4;
  StableFault fault = 5;
  optional sint32 exit_code = 6;
  uint32 observed_host_calls = 7;
  uint64 fuel_remaining = 8;
}
