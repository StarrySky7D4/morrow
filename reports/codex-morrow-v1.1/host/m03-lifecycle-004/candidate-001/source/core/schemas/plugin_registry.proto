syntax = "proto3";
package morrow.plugin.registry.v1;
// Canonical snapshots: v1 has no IO approval; v2 adds an independent IO ceiling.
// Unknown/noncanonical fields are rejected, never dropped.
message Selection {
  string package_id = 1;
  bytes digest = 2;
  bool enabled = 3;
  // Numeric values match morrow.plugin.v1.Capability. These are ceilings, not grants.
  repeated int32 approved_capabilities = 4;
  // Separate IO namespace; never interpret these values as content capabilities.
  repeated int32 approved_io_capabilities = 5;
}
// Declarative exact-package approval. No scope, TTL, instance or live lease is persisted.
message LockedDependency {
  string caller_id = 1;
  bytes caller_digest = 2;
  string slot = 3;
  string provider_id = 4;
  bytes provider_digest = 5;
}
message Registry {
  uint32 schema_version = 1;
  uint64 revision = 2;
  repeated Selection selections = 3;
  repeated LockedDependency dependency_locks = 4;
}
