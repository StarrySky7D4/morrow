[workspace]
resolver = "2"
[package]
name = "morrow-upload-wasm-codecs"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[lib]
crate-type = ["staticlib"]
[dependencies]
morrow-plugin-sdk = { path = "../../rust", features = ["wasm-c"] }
morrow-blob-transfer-v1 = { path = "../../../extensions/blob-transfer-v1" }
morrow-blob-upload-request-v1 = { path = "../../../extensions/blob-upload-request-v1" }
morrow-blob-upload-proposal-v1 = { path = "../../../extensions/blob-upload-proposal-v1" }
morrow-blob-upload-sample = { path = "../../examples/blob-upload-common" }
sha2 = "=0.10.9"
[profile.release]
panic = "abort"
opt-level = 2
