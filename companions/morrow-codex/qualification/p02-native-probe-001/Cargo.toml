[workspace]
resolver = "2"

[package]
name = "morrow-codex-p02-native-probe"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "p02-native-probe"
path = "src/main.rs"

[dependencies]
codex-api = { path = "../../upstream/p02-source-batch-001/codex-source/codex-rs/codex-api" }
codex-client = { path = "../../upstream/p02-source-batch-001/codex-source/codex-rs/codex-client" }
morrow-agent-host-contract = { path = "../../sdk/host-kit-003-copy", default-features = false }
http = "=1.4.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["rt", "time"] }

# These isolated build copies retain every verified upstream Rust source byte.
# Only tokio-tungstenite's nested dependency declaration is redirected to the
# exact local tungstenite copy. The manifest-only patch is separately recorded
# in receipts/p02-dependency-cache-001/build-forks-001. The unused crossterm
# patch is excluded: it is
# absent even from this probe's conservative codex-api lock dependency graph.
[patch.crates-io]
tokio-tungstenite = { path = "../../out/p02-native-probe-001/build-forks/tokio-tungstenite" }
tungstenite = { path = "../../out/p02-native-probe-001/build-forks/tungstenite" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { path = "../../out/p02-native-probe-001/build-forks/tungstenite" }

[patch."https://github.com/dzbarsky/rules_rust"]
runfiles = { path = "../../out/p02-native-probe-001/build-forks/runfiles" }
