[workspace]
resolver = "2"

[package]
name = "morrow-protected-checked-vm-harness"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
anyhow = "=1.0.104"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
# This is the sole relocated Workbench with the controlled original-owner seam.
morrow-workbench-host = { path = "../../../../workbench_host" }
morrow-core = { path = "../../../../core" }
morrow-plugin-runtime = { path = "../../../../plugin_runtime", features = ["packages"] }
morrow-agent-catalog-admin-v1 = { path = "../../../../extensions/agent-catalog-admin-v1" }
morrow-agent-session-exec-v1-r2 = { path = "../../../../extensions/agent-session-exec-v1-r2" }
morrow-agent-process-control-v1 = { path = "../../../../extensions/agent-process-control-v1" }
morrow-agent-session-process-v1-host = { path = "../../../../extensions/agent-session-process-v1-host" }
morrow-codex-session-exec-windows-v1 = { path = "../../session-exec-windows-v1" }
codex-exec-server = { path = "../../derived/c28-cleanup-com-002/codex-rs/exec-server" }
codex-windows-sandbox = { path = "../../derived/c28-cleanup-com-002/codex-rs/windows-sandbox-rs" }
codex-protocol = { path = "../../upstream/p02-integration-004/codex-work/codex-rs/protocol" }
codex-utils-path-uri = { path = "../../upstream/p02-integration-004/codex-work/codex-rs/utils/path-uri" }
codex-utils-absolute-path = { path = "../../upstream/p02-integration-004/codex-work/codex-rs/utils/absolute-path" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
zeroize = "=1.9.0"
dunce = "=1.0.5"
winapi-util = "=0.1.11"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
