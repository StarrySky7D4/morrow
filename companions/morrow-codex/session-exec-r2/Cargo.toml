[workspace]
resolver = "2"

[package]
name = "morrow-codex-session-exec-r2"
version = "0.1.0-experimental.2"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
morrow-agent-session-exec-v1-r2 = { path = "../../../extensions/agent-session-exec-v1-r2", default-features = false }
codex-thread-store = { path = "../upstream/p02-integration-004/codex-work/codex-rs/thread-store" }
codex-exec-server = { path = "../upstream/p02-integration-004/codex-work/codex-rs/exec-server" }
codex-protocol = { path = "../upstream/p02-integration-004/codex-work/codex-rs/protocol" }
codex-rollout = { path = "../upstream/p02-integration-004/codex-work/codex-rs/rollout" }
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time"] }
getrandom = "=0.4.3"

[dev-dependencies]
tempfile = "=3.27.0"

# The real upstream workspace requires these exact public forks (the proxy
# feature is absent from crates.io tokio-tungstenite 0.28.0).
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
