[workspace]
resolver = "2"

[package]
name = "morrow-network-node-stream"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
default = []
# Explicit native host bridge; ordinary transport builds do not link Core/runtime.
managed-channel = ["dep:morrow-core", "dep:morrow-plugin-runtime", "dep:capnp", "dep:capnpc", "dep:sha2"]
# Separate trusted native WebSocket source; never an implicit guest IO grant.
managed-websocket = ["managed-channel", "dep:tokio-tungstenite"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
url = "=2.5.8"
futures-util = { version = "=0.3.33", features = ["sink"] }
bytes = "=1.12.1"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

morrow-core = { path = "../core", optional = true }
morrow-plugin-runtime = { path = "../plugin_runtime", optional = true, features = ["packages"] }
capnp = { version = "=0.24.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"], optional = true }

[build-dependencies]
capnpc = { version = "=0.24.0", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
wat = "=1.239.0"
sha2 = "=0.10.9"
morrow-plugin-runtime = { path = "../plugin_runtime", features = ["packages", "fault-injection"] }
