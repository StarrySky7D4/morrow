[workspace]
resolver = "2"

[package]
name = "morrow-fs-watch-native-v1"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
morrow-fs-watch-v1 = { path = "../fs-watch-v1" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }


[features]
qualification-probe = []

[[bin]]
name = "native_watch_probe"
path = "src/bin/native_watch_probe.rs"
required-features = ["qualification-probe"]
