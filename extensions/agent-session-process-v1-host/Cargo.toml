[workspace]
resolver = "2"

[package]
name = "morrow-agent-session-process-v1-host"
version = "0.1.0-experimental.1"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
morrow-agent-session-exec-v1-r2 = { path = "../agent-session-exec-v1-r2" }
morrow-agent-process-control-v1 = { path = "../agent-process-control-v1" }
morrow-core = { path = "../../core" }
morrow-plugin-runtime = { path = "../../plugin_runtime", features = ["package-execution", "package-management"] }
prost = "=0.14.4"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
getrandom = "=0.4.3"
tempfile = "=3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
morrow-plugin-runtime = { path = "../../plugin_runtime", features = ["packages"] }

[dev-dependencies]
wat = "=1.239.0"
