[workspace]
resolver = "2"

[package]
name = "morrow-agent-session-exec-v1-r2"
version = "0.1.0-experimental.2"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
default = ["host"]
host = ["dep:morrow-core", "dep:getrandom"]

[dependencies]
capnp = "=0.24.1"
sha2 = "=0.10.9"
prost = "=0.14.4"
morrow-core = { path = "../../core", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "=0.4.3", optional = true }

[build-dependencies]
capnpc = "=0.24.0"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = "=0.40.2"

[[test]]
name = "session"
required-features = ["host"]

[[test]]
name = "safe_exec"
required-features = ["host"]
