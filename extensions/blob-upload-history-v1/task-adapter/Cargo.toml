[workspace]
resolver = "2"

[package]
name = "morrow-blob-upload-history-task-v1"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
morrow-blob-upload-history-v1 = { path = ".." }
morrow-plugin-sdk = { path = "../../../sdk/rust" }

[dev-dependencies]
capnp = { version = "=0.24.1", features = ["unaligned"] }
sha2 = "=0.10.9"
