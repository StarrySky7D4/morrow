[workspace]
resolver = "2"
[package]
name = "morrow-history-fixture-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[lib]
crate-type = ["cdylib"]
[dependencies]
morrow-blob-upload-history-v1 = { path = "../.." }
morrow-plugin-sdk = { path = "../../../../sdk/rust", features = ["wasm-guest"] }
[profile.release]
panic = "abort"
opt-level = 2
