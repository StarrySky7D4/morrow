[workspace]
resolver = "2"
[package]
name = "morrow-history-fixture-codecs"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
[lib]
crate-type = ["staticlib"]
[dependencies]
morrow-blob-upload-history-v1 = { path = "../.." }
morrow-blob-upload-history-task-v1 = { path = "../../task-adapter" }
morrow-plugin-sdk = { path = "../../../../sdk/rust", features = ["wasm-c"] }
[profile.release]
panic = "abort"
opt-level = 2
